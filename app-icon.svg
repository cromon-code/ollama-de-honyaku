<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Main Illustration Group -->
  <g filter="url(#dropShadow)">
    <!-- Cute Simple White Alpaca Body & Head -->
    <!-- Alpaca Fluffy Neck & Head Base -->
    <path fill="#FFFFFF" d="
      M 160 380 
      C 160 300, 175 250, 185 200 
      C 188 185, 180 170, 180 150 
      C 180 135, 190 120, 210 115 
      C 225 110, 245 115, 255 125 
      C 265 135, 270 150, 265 170 
      C 260 190, 255 210, 255 240 
      C 255 280, 265 330, 275 380 
      Z" />

    <!-- Alpaca Fluffy Chest / Ears / Face details -->
    <!-- Left Ear -->
    <path fill="#FFFFFF" d="M 190 125 C 180 100, 185 75, 195 70 C 205 65, 205 90, 205 115 Z" />
    <!-- Right Ear -->
    <path fill="#FFFFFF" d="M 230 125 C 235 95, 245 70, 255 75 C 265 80, 255 105, 245 125 Z" />

    <!-- Alpaca Fluffy Hair Tuft on head -->
    <path fill="#FFFFFF" d="M 200 115 C 205 100, 230 100, 235 115 C 240 105, 250 110, 245 120 Z" />

    <!-- Cute Eye & Muzzle (Cutout in Indigo) -->
    <!-- Closed Happy Eye / Eye -->
    <circle cx="212" cy="140" r="5" fill="#4F46E5" />
    <!-- Cute Nose & Mouth -->
    <path fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 194 148 C 190 152, 190 158, 196 158 C 202 158, 200 152, 194 148 Z" />

    <!-- Translation Speech Bubbles coming from the Alpaca -->
    <!-- Left Speech Bubble: "A" (Source text) -->
    <g transform="translate(265, 120)">
      <path fill="#FFFFFF" opacity="0.95" d="M 10 0 h 90 a 20 20 0 0 1 20 20 v 40 a 20 20 0 0 1 -20 20 h -60 l -20 20 v -20 h -10 a 20 20 0 0 1 -20 -20 v -40 a 20 20 0 0 1 20 -20 z" />
      <text x="55" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="42" fill="#4F46E5" text-anchor="middle">A</text>
    </g>

    <!-- Right Speech Bubble: "文" / "あ" (Target translated text) -->
    <g transform="translate(320, 220)">
      <path fill="#FFFFFF" d="M 10 0 h 95 a 20 20 0 0 1 20 20 v 45 a 20 20 0 0 1 -20 20 h -20 l -15 20 v -20 h -60 a 20 20 0 0 1 -20 -20 v -45 a 20 20 0 0 1 20 -20 z" />
      <text x="57" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="42" fill="#8B5CF6" text-anchor="middle">文</text>
    </g>

    <!-- Sparkle / Magic Arrows connecting translation -->
    <path fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6" d="M 320 200 C 340 180, 370 180, 380 210" />
    <polygon points="383,212 372,205 385,200" fill="#FFFFFF" />
  </g>
</svg>
